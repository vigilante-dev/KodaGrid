{% csrf_token %}
{{ form.non_field_errors }}
{% for field in form %}
    <div class="form-field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}
            <small>{{ field.help_text }}</small>
        {% endif %}
        {% for error in field.errors %}
            <small class="form-error">{{ error }}</small>
        {% endfor %}
    </div>
{% endfor %}
