{% extends 'base.html' %}

{% block title %}Reset Password | CoderGrid{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container auth-card narrow-card">
        <h1>Reset your password</h1>
        <p>Enter your account email and we will send reset instructions.</p>
        <form method="post" class="stacked-form">
            {% include 'includes/form_fields.html' %}
            <button class="btn btn-primary btn-full" type="submit">Send Reset Link</button>
        </form>
    </div>
</section>
{% endblock %}
